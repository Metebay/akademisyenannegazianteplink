<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akademisyen Anne Gaziantep</title>
    <style>
        body {
            background-color: #dff2ce; /* Light green background */
            font-family: 'Poppins', Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #333;
        }

        .container {
            width: 90%;
            max-width: 400px;
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            padding: 20px;
            text-align: center;
        }

        .logo {
            max-width: 120px;
            margin: 0 auto 20px;
            display: block;
            border-radius: 50%;
            border: 3px solid #a8dba8; /* Green border */
            padding: 5px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #2c3e50; /* Darker text for contrast */
        }

        .links a {
            display: block;
            text-decoration: none;
            color: #ffffff; /* White text */
            background-color: #6ab04c; /* Green button background */
            padding: 12px;
            margin: 10px 0;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 500;
            transition: background-color 0.3s, transform 0.3s;
        }

        .links a:hover {
            background-color: #4a9b3d; /* Darker green on hover */
            transform: scale(1.05);
        }

        .footer {
            margin-top: 20px;
            font-size: 14px;
            color: #7d7d7d;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 20px;
            }

            .logo {
                max-width: 100px;
            }

            .links a {
                font-size: 14px;
                padding: 10px;
                margin: 8px 0;
            }

            .container {
                padding: 15px;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <img src="Adsız tasarım (17).png" alt="Logo" class="logo">
        <h1>Akademisyen Anne Gaziantep Bağlantı Sayfası</h1>

        <div class="links">
            <a href="https://forms.gle/mXmjesHoTgm8n1Kv6">Ön Başvuru Formu</a>
            <a href="https://maps.app.goo.gl/5gPAHD6vQxQw69Ka6">Konum</a>
            <a href="https://akademisyenanneanaokullari.com/">Web Site</a>
        </div>
    </div>

    <div class="footer">
        © 2025 Akademisyen Anne Gaziantep. Tüm hakları saklıdır.
    </div>
</body>
</html>
